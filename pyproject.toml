[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "refract-pptx"
version = "0.7.0"
description = "Agent-guided task factory for editable presentation reconstruction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Haikong Lu" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "Pillow>=10.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
demo = ["python-pptx>=1.0", "reportlab>=4.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "python-pptx>=1.0",
  "reportlab>=4.0",
]

[project.scripts]
refract = "refract_pptx.cli:main"

[project.urls]
Homepage = "https://github.com/Haikong-Lu1206/REFRACT-PPTX"
Documentation = "https://github.com/Haikong-Lu1206/REFRACT-PPTX/blob/main/docs/getting-started.md"
Issues = "https://github.com/Haikong-Lu1206/REFRACT-PPTX/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/refract_pptx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
