name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: refract doctor
      - run: >-
          python -c "import refract_pptx.build, refract_pptx.corpus, refract_pptx.design,
          refract_pptx.evaluation, refract_pptx.families, refract_pptx.mutation,
          refract_pptx.validation"
      - run: refract --help
      - run: ruff check .
      - run: pytest
