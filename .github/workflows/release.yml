name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/package version mismatch'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test wheel outside checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -m refract_pptx --version
          python -m refract_pptx init-workspace example
      - name: Publish alpha release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease \
            --title "REFRACT $GITHUB_REF_NAME (Alpha)" --notes-file docs/release-notes.md
